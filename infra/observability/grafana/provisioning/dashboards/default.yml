# Grafana pano sağlama — dashboards/ klasöründeki JSON'ları otomatik yükler
apiVersion: 1

providers:
  - name: SENTINEL
    orgId: 1
    folder: SENTINEL
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
