# ══════════════════════════════════════════════════════════════
#  Prometheus — SENTINEL metrik toplama
#  Metrik listesi: PLAN.md §13.1
# ══════════════════════════════════════════════════════════════

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 30s
  external_labels:
    project: sentinel

scrape_configs:

  # Prometheus'un kendisi
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # MediaMTX — akış sağlığı, bağlı istemci sayısı, bayt hacmi
  - job_name: mediamtx
    static_configs:
      - targets: ["mediamtx:9998"]

  # ─── Windows'ta NATIVE çalışan Python bileşenleri ───────────
  # host.docker.internal, konteynerden Windows host'una erişim sağlar.
  # (Geliştirme stratejisi: altyapı Docker'da, YZ worker'ları native)
  # Henüz ayakta değiller — hedefler DOWN görünecek, normaldir.

  - job_name: sentinel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          component: api

  - job_name: sentinel-ingest
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9101"
          - "host.docker.internal:9102"
          - "host.docker.internal:9103"
          - "host.docker.internal:9104"
        labels:
          component: ingest

  - job_name: sentinel-inference
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9110"]
        labels:
          component: inference

  - job_name: sentinel-analytics
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9120"]
        labels:
          component: analytics
