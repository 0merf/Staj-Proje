# ══════════════════════════════════════════════════════════════
#  Prometheus — SENTINEL metrik toplama
#  Metrik listesi: PLAN.md §13.1
# ══════════════════════════════════════════════════════════════

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 30s
  external_labels:
    project: sentinel

scrape_configs:

  # Prometheus'un kendisi
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # MediaMTX — akış sağlığı, bağlı istemci sayısı, bayt hacmi
  - job_name: mediamtx
    static_configs:
      - targets: ["mediamtx:9998"]

  # ─── Windows'ta NATIVE çalışan Python bileşenleri ───────────
  # host.docker.internal, konteynerden Windows host'una erişim sağlar.
  # (Geliştirme stratejisi: altyapı Docker'da, YZ worker'ları native)
  # Henüz ayakta değiller — hedefler DOWN görünecek, normaldir.

  - job_name: sentinel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          component: api

  # ⚠ 01.09.2026 — DÖRT HEDEF ÜÇÜ ÖLÜYDÜ
  # Bu liste "4 ingest worker" tasarımından kalmıştı. O tasarım
  # değişti (tek süreç + kamera başına thread, çünkü FramePool tek
  # nesne olarak paylaşılabiliyor ve PyAV/OpenCV GIL'i bırakıyor) ama
  # kazıma yapılandırması güncellenmemişti.
  #
  # Sonucu: Prometheus hedef listesinde ASLA ayağa kalkmayacak üç
  # hedef sürekli DOWN görünüyordu. Zararsız gibi duruyor ama
  # gözlem sisteminin en değerli özelliğini bozar — "kırmızı bir şey
  # varsa bakılır" alışkanlığını. Hep kırmızı duran bir gösterge,
  # olmayan göstergeden kötüdür (aynı ders: çalışmayan kalite kapısı).
  - job_name: sentinel-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          component: ingest

  - job_name: sentinel-inference
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9110"]
        labels:
          component: inference

  # ⚠ 01.09.2026 — ALARM WORKER'I HİÇ KAZINMIYORDU
  # `sentinel_olaylar_yazildi_total` metriği vardı, üretiliyordu, ama
  # Prometheus'a hiç ulaşmıyordu. Grafana panosundaki "üretilen vs
  # kaydedilen alarm" karşılaştırması kalıcı olarak yarım kalırdı —
  # ve o karşılaştırmanın amacı tam da veritabanı yolunun sessizce
  # tıkandığını görmekti.
  - job_name: sentinel-alerting
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9130"]
        labels:
          component: alerting

  - job_name: sentinel-analytics
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9120"]
        labels:
          component: analytics
