# ══════════════════════════════════════════════════════════════
#  Valkey — SENTINEL mesaj kuyruğu ve canlı durum önbelleği
#  Redis değil — Valkey (BSD-3, Linux Foundation). Protokol aynı.
# ══════════════════════════════════════════════════════════════

bind 0.0.0.0
port 6379

# Parola docker-compose'da --requirepass ile veriliyor.
# Portlar yalnızca 127.0.0.1'e bağlı olduğu için dış erişim yok.
protected-mode no

# ─── Kalıcılık: kapalı ────────────────────────────────────────
# Gerekçe: Stream'lerimiz geçici çalışma verisidir. Sistem yeniden
# başladığında 10 saniye önceki video karesinin hiçbir değeri yoktur.
# Diske yazmak boşuna I/O yükü olur. Kalıcı veri PostgreSQL'de.
save ""
appendonly no

# ─── Bellek ───────────────────────────────────────────────────
maxmemory 2gb
# noeviction: kuyruk boyutları uygulama tarafında XADD MAXLEN ile
# sınırlanıyor. Valkey'in kendi kararıyla stream
# silmesini istemiyoruz — sessiz veri kaybı hata ayıklamayı zehirler.
maxmemory-policy noeviction

# ─── AĞ ───────────────────────────────────────────────────────
timeout 0
tcp-keepalive 300
tcp-backlog 511

# ─── Log ──────────────────────────────────────────────────────
loglevel notice

# ─── Yavaş sorgu kaydı ────────────────────────────────────────
# 10 ms'den uzun süren komutları kaydet — darboğaz teşhisi için
slowlog-log-slower-than 10000
slowlog-max-len 128
