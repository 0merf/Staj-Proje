<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="Segoe UI, Arial, sans-serif">
  <!--
    SENTINEL — TEK GIRIS NOKTASI VE VIDEO KIMLIK DOGRULAMASI
    Uretildi: 11.09.2026 · akademik gri tonlama (renk bilgi tasimaz)
    Kaynak: infra/caddy/Caddyfile · e2e/g18-tls.spec.ts (5 test)
  -->
  <defs>
    <marker id="o" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#000000"/>
    </marker>
    <style>
      .kutu   { fill:#ffffff; stroke:#000000; stroke-width:1.6; rx:5; }
      .vurgu  { fill:#ececec; stroke:#000000; stroke-width:2; rx:5; }
      .kapali { fill:#f5f5f5; stroke:#000000; stroke-width:1.6; stroke-dasharray:6 4; rx:5; }
      .b { font-size:12.5px; font-weight:600; fill:#000000; }
      .a { font-size:10px; fill:#222222; }
      .e { font-size:9.5px; fill:#555555; }
      .ok { stroke:#000000; stroke-width:1.6; fill:none; marker-end:url(#o); }
      .okk { stroke:#000000; stroke-width:1.4; fill:none; marker-end:url(#o); stroke-dasharray:5 3; }
    </style>
  </defs>

  <text x="20" y="24" font-size="13" font-weight="700" fill="#000000">Tek giriş noktası: video akışı da uygulama ile aynı kimlik doğrulamasından geçer</text>

  <!-- Tarayıcı -->
  <rect x="20" y="120" width="150" height="72" class="kutu"/>
  <text x="32" y="146" class="b">Tarayıcı</text>
  <text x="32" y="164" class="a">HttpOnly çerez</text>
  <text x="32" y="180" class="a">(sentinel_token)</text>

  <!-- Caddy -->
  <rect x="245" y="100" width="180" height="112" class="vurgu"/>
  <text x="257" y="126" class="b">Caddy (ters vekil)</text>
  <text x="257" y="145" class="a">TLS sonlandırma</text>
  <text x="257" y="162" class="a">tek giriş noktası</text>
  <text x="257" y="179" class="a">güvenlik başlıkları</text>
  <text x="257" y="199" class="e">HSTS, nosniff, DENY</text>

  <!-- FastAPI -->
  <rect x="520" y="20" width="200" height="92" class="kutu"/>
  <text x="532" y="46" class="b">Uygulama arayüzü</text>
  <text x="532" y="65" class="a">/api/v1/auth/ben</text>
  <text x="532" y="82" class="a">geçerli ise 200</text>
  <text x="532" y="99" class="a">değilse 401</text>

  <!-- MediaMTX -->
  <rect x="520" y="150" width="200" height="76" class="kutu"/>
  <text x="532" y="176" class="b">Medya sunucusu</text>
  <text x="532" y="195" class="a">WHEP video akışı</text>
  <text x="532" y="212" class="a">doğrudan erişilemez</text>

  <!-- İç uçlar: kapali -->
  <rect x="520" y="258" width="200" height="76" class="kapali"/>
  <text x="532" y="284" class="b">İç uçlar</text>
  <text x="532" y="303" class="a">/metrics · kök sayfa</text>
  <text x="532" y="320" class="a">vekilde 404 / yönlendirme</text>

  <!-- Oklar -->
  <line x1="170" y1="156" x2="241" y2="156" class="ok"/>
  <text x="176" y="149" class="e">HTTPS</text>

  <path d="M 350 100 L 350 56 L 512 56" class="ok"/>
  <text x="358" y="48" class="e">1. yetki sorgusu</text>

  <path d="M 516 92 L 400 92 L 400 100" class="okk"/>
  <text x="408" y="86" class="e">2. 200 / 401</text>

  <line x1="425" y1="186" x2="516" y2="186" class="ok"/>
  <text x="432" y="179" class="e">3. yalnızca 200 ise</text>

  <line x1="425" y1="200" x2="516" y2="290" class="okk"/>
  <text x="392" y="258" class="e">dışarıya kapalı</text>

  <!-- Alt not -->
  <rect x="20" y="352" width="1020" height="62" fill="#f5f5f5" stroke="#000000" stroke-width="1.2" rx="5"/>
  <text x="34" y="374" class="a" font-weight="600">Tasarımın gerekçesi:</text>
  <text x="34" y="392" class="a">Video ayrı bir kökenden sunulsaydı tarayıcı kimlik çerezini o isteklere eklemezdi ve video doğrulanamazdı. Tek giriş noktası bir kolaylık değil,</text>
  <text x="34" y="408" class="a">video kimlik doğrulamasının ön koşuludur. İç uçların ayrıca kapatılması gerekmektedir; tek noktaya indirmek tek başına yeterli değildir.</text>
</svg>
