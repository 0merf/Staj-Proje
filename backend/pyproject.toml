[project]
name = "sentinel"
version = "0.1.0"
description = "SENTINEL — Çok kameralı akıllı gözetim sistemi"
requires-python = ">=3.13"

# ─── ÇEKİRDEK BAĞIMLILIKLAR ───────────────────────────────────
# Faz 0-2 için yeterli. Ağır ML paketleri 'gpu' extra'sında (aşağıda),
# çünkü PyTorch'un CUDA yapısı ayrı bir indeks gerektirir ve
# Gün 4'e (ilk YOLO çalıştırması) kadar ihtiyacımız yok.
dependencies = [
    # Web katmanı
    "fastapi>=0.136",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "websockets>=14",
    # Konfigürasyon ve doğrulama
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Veritabanı
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Valkey — redis-py protokol uyumludur, Valkey ile değişmeden çalışır
    "redis>=5.2",
    # Video ve görüntü işleme
    "av>=13.1",              # PyAV — shell'e çıkmaz, komut enjeksiyonu riski yok
    "opencv-python>=4.10",   # MOG2 hareket filtresi + YuNet yüz tespiti
    "numpy>=2.1",
    # Güvenlik (PLAN.md §11.1)
    "argon2-cffi>=23.1",     # G01 — parola hash'i (MD5/SHA DEĞİL)
    "pyjwt>=2.10",           # G02
    "cryptography>=44",
    # Depolama (S3 / Garage)
    "boto3>=1.35",
    # Gözlemlenebilirlik
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # Analitik (hafif — ağır ML değil)
    "scikit-learn>=1.6",     # IsolationForest — kamera normal profili
    "scipy>=1.15",
    # Yardımcılar
    "orjson>=3.10",
    "httpx>=0.28",
    "typer>=0.15",           # worker başlatma CLI'ı
]

# ⚠ `emotiefflib` ve `onnxruntime-gpu` buradan ÇIKARILDI, `gpu` extra'ya
#   taşındı. İki sebep:
#   1. Bu dosyanın kendi kuralı: "Ağır ML paketleri 'gpu' extra'sında."
#      emotiefflib ağır bir ML paketi; çekirdekte olması kurala aykırıydı.
#   2. `onnxruntime-gpu` İKİ YERDE, ÇELİŞEN kısıtlarla tanımlıydı
#      (çekirdekte >=1.28.0, gpu extra'sında >=1.20). uv iki kısıtı
#      kesiştirmek zorunda kalıyordu ve hangi sürümün çözüldüğü
#      belirsizleşiyordu — "onnxruntime CUDA sağlayıcısı etkinleşmedi"
#      açık maddesinin muhtemel kaynağı bu.

# ─── GPU / ML BAĞIMLILIKLARI ─────────────────────────────────
#  Kurulum:  uv sync --extra gpu
#  ⚠ PyTorch'un CUDA yapısı ayrı indeksten gelir. Doğru CUDA sürümü
#    Gün 4'te donanım üzerinde doğrulanacak (LITERATUR.md §O / S01).
[project.optional-dependencies]
gpu = [
    "torch>=2.6",
    "torchvision>=0.21",
    "ultralytics>=8.3",      # YOLO26 / YOLO11   ⚠ Lisans: AGPL-3.0
    # KADEME 2b — yüz ifadesi. TEK tanım burada (çekirdekten taşındı).
    # ⚠ CUDA sağlayıcısı bu ortamda yüklenmedi (beklediği cuDNN yok);
    #   model CPU'da ~58 ms/yüz. Ölçüm:
    #   benchmarks/expression_20260817-gun13.json
    "onnxruntime-gpu>=1.20",
    "emotiefflib>=1.1.1",
    "lightgbm>=4.5",         # tırmanma skoru taban modeli
    # BoT-SORT'un eşleştirme adımı (Macar algoritması) bunu kullanır.
    # Ultralytics eksikse çalışma anında kendisi kurmaya çalışıyor —
    # tekrarlanabilirlik ve tedarik zinciri güvenliği için açıkça pinliyoruz.
    "lap>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pip-audit>=2.7",        # G24 — bağımlılık güvenlik taraması
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.uv]
package = true

# ─── onnxruntime (CPU) BİLEREK ELENİYOR ───────────────────────
# Sorun: `emotiefflib` bağımlılık olarak `onnxruntime` (CPU derlemesi)
# istiyor. Biz `onnxruntime-gpu` kuruyoruz. İkisi de PyPI'da AYRI paket
# ama **aynı dizine** (`site-packages/onnxruntime/`) açılıyor. Sonuç:
# hangisi sonra kurulursa `onnxruntime.dll`'i o eziyor. Bizde CPU
# sürümü kazanmıştı ve tablo şöyleydi:
#
#     get_available_providers() -> ['AzureExecutionProvider',
#                                   'CPUExecutionProvider']
#     capi/ dizininde ise: onnxruntime_providers_cuda.dll     ← duruyor
#                          onnxruntime_providers_tensorrt.dll ← duruyor
#
# Yani CUDA sağlayıcısının DLL'i diskteydi ama ana kütüphane onu
# tanımıyordu — öksüz dosyalar. "onnxruntime CUDA sağlayıcısı
# etkinleşmedi" açık maddesinin kök sebebi buydu; eksik cuDNN değil,
# iki paketin aynı dizini paylaşması.
#
# Neden elemek güvenli: `onnxruntime-gpu` da `onnxruntime` MODÜLÜNÜ
# sağlıyor. emotiefflib'in `import onnxruntime` satırı çalışmaya devam
# ediyor; bağımlılık beyanı sadece fazla dar yazılmış.
#
# Aşağıdaki her zaman yanlış olan işaretleyici (marker), uv'nin bir
# geçişli bağımlılığı çözüm ağacından çıkarmak için belgelediği yöntem.
override-dependencies = ["onnxruntime ; python_version < '0'"]

# ─── PyTorch CUDA indeksi ─────────────────────────────────────
# PyPI'daki torch wheel'i Windows'ta CPU-ONLY gelir. CUDA yapısı
# PyTorch'un kendi indeksinden alınmalı.
#
# Neden cu128: RTX 3070 Ampere (sm_86) mimarisi; cu126/128/129'un üçü de
# çalışır. cu128 en geniş test edilmiş ve sürücü 610.88 ile uyumlu.
# Doğrulama: uv run python -c "import torch; print(torch.cuda.is_available())"
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# ─── RUFF (lint + format) ────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # asenkron hataları
    "S",        # bandit — GÜVENLİK (shell=True, sabit sır, zayıf hash…)
    "RUF",
]
ignore = [
    "S101",     # assert — testlerde normal
    "E501",     # satır uzunluğu — formatter hallediyor

    # Bu proje Türkçe dokümante edilmiştir. RUF001/002/003 kuralları
    # Türkçe harfleri (ı, ş, ğ, İ) "belirsiz unicode" sayıp yüzlerce
    # yanlış pozitif üretiyor. Kural kodla değil, dille ilgili.
    "RUF001",   # dizgede belirsiz karakter
    "RUF002",   # docstring'de belirsiz karakter
    "RUF003",   # yorumda belirsiz karakter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

# ─── MYPY ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# ⚠ 03.09.2026 — LİSTE GERÇEKLE HİZALANDI
# Önceki liste kurulu OLMAYAN üç paketi (sklearn, lightgbm, botocore)
# sayıyordu ve gerçekten kullanılan ikisini (emotiefflib, torch)
# saymıyordu. Sonuç: mypy 13 hata veriyordu ve bunların 3'ü kodla
# değil, bu listeyle ilgiliydi.
#
# ⚠ Neden `ignore_missing_imports` ve neden `follow_imports=skip` değil:
# bu paketlerin hiçbiri tip bilgisi (py.typed) yayınlamıyor. Onları
# yok saymak bizim kodumuzun denetimini kapatmıyor, yalnızca üçüncü
# taraf sınırında duruyor.
#
# `sklearn`/`lightgbm` KASTEN duruyor: eğitilmiş saldırganlık modeli
# (K5 tabanı 0.712) yazılırsa ilk kullanılacak paketler bunlar ve
# `warn_unused_configs` bunları "kullanılmayan bölüm" diye bildiriyor
# — o uyarı kabul edildi, hata değil.
[[tool.mypy.overrides]]
module = [
    "cv2.*", "av.*", "ultralytics.*", "emotiefflib.*", "onnxruntime.*",
    "sklearn.*", "lightgbm.*", "boto3.*", "botocore.*",
]
ignore_missing_imports = true
# ⚠ `ultralytics` paketi `YOLO`'yu `__all__` ile AÇIKÇA ihraç etmiyor
# ve mypy bunu `attr-defined` hatası sayıyor. Sınıf var, çalışıyor,
# yıllardır kamuya açık API'nin parçası — burada denetlenen şey
# paketin kendi paketleme titizliği, bizim kodumuz değil.
implicit_reexport = true

# ─── PYTEST ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: altyapı gerektirir (docker compose up)",
    "gpu: GPU gerektirir",
    "slow: uzun süren test",
]
