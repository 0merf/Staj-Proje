<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL — Sistem Durumu</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel2:#1b2230; --line:#242c3a;
    --fg:#e6edf3; --dim:#8b98ad; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
    --accent:#58a6ff;
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:22px 28px;border-bottom:1px solid var(--line);
         display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:20px;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:13px}
  .spacer{flex:1}
  #stamp{color:var(--dim);font-size:12px;font-family:var(--mono)}
  main{padding:24px 28px;max-width:1500px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;
     color:var(--dim);margin:34px 0 14px;font-weight:600}
  h2:first-child{margin-top:0}

  .grid{display:grid;gap:14px;
        grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:15px 17px}
  .card .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 9px var(--ok)}
  .dot.bad{background:var(--bad);box-shadow:0 0 9px var(--bad)}
  .dot.idle{background:var(--dim)}
  .name{font-weight:600}
  .ver{margin-left:auto;font-family:var(--mono);font-size:11px;
       color:var(--dim);background:var(--panel2);
       padding:2px 7px;border-radius:5px}
  .detail{color:var(--dim);font-size:13px}
  .lat{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:7px}
  .card.bad{border-color:#5a2224;background:#1a1214}

  .cams{display:grid;gap:14px;
        grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .cam{background:var(--panel);border:1px solid var(--line);
       border-radius:10px;overflow:hidden}
  .cam .bar{display:flex;align-items:center;gap:8px;
            padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
  .cam .bar .tag{font-family:var(--mono);font-size:10px;
                 color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
  .cam .bar .close{margin-left:auto;background:transparent;border:1px solid var(--line);
       color:var(--dim);border-radius:6px;padding:2px 9px;font-size:12px;
       cursor:pointer;line-height:1.4}
  .cam .bar .close:hover{border-color:var(--bad);color:var(--bad)}
  .cam .bar .close.hidden{display:none}
  .cam .frame{aspect-ratio:16/9;background:#05070b;position:relative}
  .cam iframe{width:100%;height:100%;border:0;display:block}
  /* Kutular VİDEONUN ÜSTÜNE çizilir — sunucu videoya dokunmaz.
     pointer-events:none olmalı ki oynatıcı kontrolleri tıklanabilsin. */
  .cam canvas.ov{position:absolute;inset:0;width:100%;height:100%;
                 pointer-events:none;z-index:2}
  .cam .badge{position:absolute;top:8px;left:8px;z-index:3;
              background:rgba(5,7,11,.78);border:1px solid var(--line);
              border-radius:6px;padding:3px 8px;font-family:var(--mono);
              font-size:11px;color:var(--fg)}
  .cam .badge.hot{border-color:var(--ok);color:var(--ok)}
  .cam .badge.warn{border-color:var(--warn);color:var(--warn)}
  .cam .off{position:absolute;inset:0;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:7px;
            color:var(--dim);font-size:13px;text-align:center;padding:18px}
  .cam .off b{color:var(--fg);font-weight:600}
  .cam .off button.stop{background:var(--bad) !important;color:#fff !important}
  .cam .off button.play,.cam .off button.stop{background:var(--accent);color:#06111f;border:0;
       border-radius:8px;padding:9px 20px;font-size:14px;font-weight:600;
       cursor:pointer}
  .cam .off button.play:hover,.cam .off button.stop:hover{filter:brightness(1.12)}
  .cam .off button.play:disabled,.cam .off button.stop:disabled{background:var(--panel2);color:var(--dim);
       cursor:not-allowed}

  .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .links a{color:var(--accent);text-decoration:none;font-size:13px;
           border:1px solid var(--line);background:var(--panel);
           padding:8px 14px;border-radius:8px}
  .links a:hover{border-color:var(--accent)}

  .note{background:var(--panel2);border-left:3px solid var(--accent);
        padding:12px 16px;border-radius:0 8px 8px 0;color:var(--dim);
        font-size:13px;margin-top:14px}
  footer{padding:26px 28px;color:var(--dim);font-size:12px;
         border-top:1px solid var(--line);margin-top:40px}
</style>
</head>
<body>

<header>
  <h1>SENTINEL <span>·</span> Sistem Durumu</h1>
  <div class="sub">Faz 0 — geliştirme paneli</div>
  <div class="spacer"></div>
  <div id="stamp">yükleniyor…</div>
</header>

<main>
  <h2>Altyapı Servisleri</h2>
  <div class="grid" id="services"></div>

  <h2>Kamera Çiftliği</h2>
  <div class="cams" id="cameras"></div>
  <div class="note" id="camnote"></div>

  <h2>Araçlar</h2>
  <div class="links" id="tools"></div>
</main>

<footer>
  Bu panel geçicidir — asıl operatör arayüzü React SPA olarak Faz 1'de gelecek.
  Amaç: altyapının çalıştığını gözle doğrulamak.
</footer>

<script>
const $ = (id) => document.getElementById(id);
let cfg = null;

async function loadConfig () {
  if (cfg) return cfg;
  cfg = await (await fetch('/api/v1/system/config')).json();
  $('tools').innerHTML = `
    <a href="${cfg.urls.grafana}" target="_blank">Grafana — paneller</a>
    <a href="${cfg.urls.prometheus}/targets" target="_blank">Prometheus — hedefler</a>
    <a href="/docs" target="_blank">API dokümantasyonu</a>`;
  return cfg;
}

// ─── Kamera kartları ────────────────────────────────────────
// ⚠ Kartlar BİR KEZ oluşturulur, sonra yalnızca durum alanları
//   güncellenir. innerHTML'i her yenilemede yeniden yazmak, oynayan
//   <iframe>'i yok edip yeniden yaratır ve video baştan başlar.
const cards = new Map();   // name -> {root, dot, meta, frame, playing}

function createCard (cam, container) {
  const root = document.createElement('div');
  root.className = 'cam';
  root.innerHTML = `
    <div class="bar">
      <span class="dot idle"></span>
      <span title="${cam.label}">${cam.name}</span>
      <span class="tag">${cam.kind === 'farm' ? 'dosya'
                        : cam.kind === 'synthetic' ? 'sentetik'
                        : cam.kind === 'webcam' ? 'webcam' : cam.kind}</span>
      <button class="close hidden" title="Kapat">✕ kapat</button>
    </div>
    <div class="frame"></div>`;
  container.appendChild(root);
  const entry = {
    root,
    dot: root.querySelector('.dot'),
    meta: root.querySelector('.bar span[title]'),
    close: root.querySelector('button.close'),
    frame: root.querySelector('.frame'),
    canvas: null,
    badge: null,
    playing: false,
  };
  // Kapat düğmesi her kamerada var. Webcam'de ek olarak yayıncı
  // sürecini de durdurur — kamera ışığı sönsün.
  entry.close.onclick = () => stopPlay(cam);
  cards.set(cam.name, entry);
  return entry;
}

async function stopPlay (cam) {
  const entry = cards.get(cam.name);
  if (!entry) return;
  if (cam.kind === 'webcam') {
    // Sadece oynatıcıyı kapatmak yetmez; kamera hâlâ açık kalır.
    await fetch('/api/v1/cameras/webcam/stop', { method: 'POST' }).catch(() => {});
  }
  entry.playing = false;
  entry.canvas = null;
  entry.badge = null;
  entry.close.classList.add('hidden');
  latest.delete(cam.name);
  renderIdle(entry, cam);
}

function renderIdle (entry, cam) {
  if (cam.kind === 'webcam') { renderWebcam(entry, cam); return; }
  entry.frame.innerHTML = `
    <div class="off">
      <button class="play">▶ İzle</button>
      <span>${cam.label}</span>
      <span style="font-size:12px">${cam.duration_s
          ? Math.round(cam.duration_s) + ' sn · döngüde'
          : 'ilk izleyicide başlar'}</span>
    </div>`;
  entry.frame.querySelector('button.play').onclick = () => startPlay(cam);
}

// ─── Webcam: panelden aç/kapat ──────────────────────────────
// Kamera KENDİLİĞİNDEN açılmaz; yalnızca bu düğmeyle başlar.
async function renderWebcam (entry, cam) {
  let st = { running: false };
  try { st = await (await fetch('/api/v1/cameras/webcam')).json(); } catch { /* API yok */ }

  if (st.running && cam.ready) {
    if (!entry.playing) {
      entry.playing = true;
      entry.frame.innerHTML =
        `<iframe src="${cfg.urls.webrtc}/${cam.name}" allow="autoplay"></iframe>`;
    }
    return;
  }

  entry.playing = false;
  entry.frame.innerHTML = `
    <div class="off">
      <button class="${st.running ? 'stop' : 'play'}">
        ${st.running ? '⏹ Kamerayı kapat' : '📷 Kamerayı aç'}
      </button>
      <span>${st.running
        ? 'yayın başlıyor, birkaç saniye…'
        : 'Laptop webcam — yalnızca sen açtığında çalışır'}</span>
      <span class="wc-msg" style="font-size:12px;color:var(--warn)"></span>
    </div>`;

  const btn = entry.frame.querySelector('button');
  const msg = entry.frame.querySelector('.wc-msg');
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = st.running ? 'kapatılıyor…' : 'açılıyor…';
    try {
      const path = st.running ? 'stop' : 'start';
      const res = await fetch(`/api/v1/cameras/webcam/${path}`, { method: 'POST' });
      const body = await res.json();
      if (body.reason) msg.textContent = body.reason;
    } catch (e) {
      msg.textContent = 'İstek başarısız: ' + e;
    }
    setTimeout(() => renderWebcam(entry, cam), 1200);
  };
}

function startPlay (cam) {
  const entry = cards.get(cam.name);
  if (!entry || entry.playing) return;
  entry.playing = true;
  entry.frame.innerHTML =
    `<iframe src="${cfg.urls.webrtc}/${cam.name}" allow="autoplay"></iframe>` +
    `<canvas class="ov"></canvas><div class="badge">analiz bekleniyor…</div>`;
  entry.canvas = entry.frame.querySelector('canvas.ov');
  entry.badge = entry.frame.querySelector('.badge');
  entry.close.classList.remove('hidden');
}

// ══════════════════════════════════════════════════════════════
//  KİLOMETRE TAŞI 1 — canlı kutular
//
//  ⚠ Video ve kutular AYRI kanaldan gelir:
//     · video  : WHEP/WebRTC → <iframe>
//     · kutular: WebSocket JSON → <canvas>
//  Sunucu videoya HİÇ dokunmaz. Böylece NVENC oturum limitine
//  takılmıyoruz ve GPU tamamen YZ'ye kalıyor (PLAN.md §9.2).
// ══════════════════════════════════════════════════════════════

const latest = new Map();   // cam -> son sonuç
let ws = null, wsState = 'kapalı', wsFrames = 0, lastFrameAt = 0;
const STALE_MS = 4000;      // bu süre sonuç gelmezse "durdu" say
// Hız vektörüyle en fazla ne kadar ileri tahmin yapılsın. Tespit
// aralığı ~330 ms; 600 ms tampon bir-iki kaçırılan tespiti tolere eder.
// Daha uzun tahmin, kişi yön değiştirdiğinde kutuyu yanlış yere taşır.
const MAX_EXTRAPOLATE_MS = 600;

function connectWs () {
  ws = new WebSocket(`ws://${location.host}/ws/live`);
  wsState = 'bağlanıyor';

  ws.onopen = () => {
    wsState = 'bağlı';
    ws.send(JSON.stringify({ type: 'subscribe', cameras: [] }));  // hepsi
  };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type !== 'frame') return;
    wsFrames++;
    // ⚠ msg.ts sunucunun MONOTONİK saatidir — Date.now() ile
    //   karşılaştırılamaz. Tazelik için tarayıcının kendi saatini kullan.
    msg._rx = performance.now();
    latest.set(msg.cam, msg);
    lastFrameAt = msg._rx;
  };
  ws.onclose = () => {
    wsState = 'kapalı — yeniden bağlanılıyor';
    setTimeout(connectWs, 2000);
  };
  ws.onerror = () => { wsState = 'hata'; };
}

// Çizim döngüsü React state'inden BAĞIMSIZ çalışır.
// Her sonuçta yeniden render tetiklemek 20 kamerada saniyede ~100
// güncelleme demek olurdu; rAF ile ekran tazeleme hızına bağlıyoruz.
function drawLoop () {
  for (const [name, entry] of cards) {
    if (!entry.playing || !entry.canvas) continue;
    const result = latest.get(name);
    const canvas = entry.canvas;
    const rect = canvas.getBoundingClientRect();
    if (canvas.width !== rect.width || canvas.height !== rect.height) {
      canvas.width = Math.max(1, Math.round(rect.width));
      canvas.height = Math.max(1, Math.round(rect.height));
    }
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const stale = !result || (performance.now() - result._rx) > STALE_MS;
    if (stale && entry.badge) {
      // Sessizce donmak yerine SEBEBİNİ söyle. "bekleniyor…" yazısının
      // sonsuza dek asılı kalması, sistemin bozuk olduğu izlenimi verir.
      entry.badge.textContent = result ? 'analiz durdu' : 'analiz bekleniyor';
      entry.badge.className = 'badge warn';
    }
    if (!result || stale) continue;

    // Kaynak kare piksellerinden görüntü alanına ölçekle.
    // Kameralar farklı çözünürlükte olabilir (cam-12: 960×720).
    const sx = canvas.width / (result.w || 1280);
    const sy = canvas.height / (result.h || 720);

    // ─── KUTU İNTERPOLASYONU ────────────────────────────────
    // Video 25 FPS, tespit ~3 FPS. Aradaki ~330 ms boyunca kutu donuk
    // kalırsa yürüyen kişi kutudan çıkar. Takipçinin verdiği hız
    // vektörüyle kutunun ŞU ANKİ konumunu tahmin ediyoruz.
    //
    // Ekstrapolasyon sınırlı: hız bilgisi eskidikçe tahmin güvenilmez
    // hale gelir. MAX_EXTRAPOLATE_MS'ten sonra kutu olduğu yerde kalır
    // (yanlış yerde kutu göstermektense donuk göstermek yeğdir).
    const ageS = Math.min((performance.now() - result._rx) / 1000, MAX_EXTRAPOLATE_MS / 1000);

    ctx.lineWidth = 2;
    ctx.font = '600 11px ui-monospace,Consolas,monospace';

    for (const det of result.detections || []) {
      const [x1, y1, x2, y2] = det.bbox;
      // v = [vx, vy] piksel/saniye — takipçiden geliyor
      const dx = (det.v ? det.v[0] : 0) * ageS;
      const dy = (det.v ? det.v[1] : 0) * ageS;

      const x = (x1 + dx) * sx, y = (y1 + dy) * sy;
      const w = (x2 - x1) * sx, h = (y2 - y1) * sy;

      // Hareket eden izler daha parlak — duranlar sönük
      const moving = det.v && (Math.abs(det.v[0]) + Math.abs(det.v[1])) > 15;
      ctx.strokeStyle = moving ? '#3fb950' : '#4d8f5c';
      ctx.fillStyle = ctx.strokeStyle;
      ctx.strokeRect(x, y, w, h);

      // Etiket: iz kimliği + güven. Kimlik, kişinin kareler boyunca
      // AYNI kişi olduğunu gösteriyor — takibin gözle görülür kanıtı.
      const label = det.id != null
        ? `#${det.id} ${(det.conf * 100).toFixed(0)}%`
        : `${(det.conf * 100).toFixed(0)}%`;
      const tw = ctx.measureText(label).width + 8;
      ctx.fillRect(x, Math.max(0, y - 15), tw, 15);
      ctx.fillStyle = '#06111f';
      ctx.fillText(label, x + 4, Math.max(11, y - 4));
      ctx.fillStyle = ctx.strokeStyle;

      // İskelet noktaları (poz modeli kullanılırsa dolu gelir)
      if (det.kp) {
        for (const [kx, ky, kc] of det.kp) {
          if (kc < 0.3) continue;
          ctx.beginPath();
          ctx.arc((kx + dx) * sx, (ky + dy) * sy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    if (entry.badge) {
      const age = ((Date.now() / 1000) - (result.ts || 0));
      entry.badge.textContent = `${result.count} kişi`;
      entry.badge.className = 'badge' + (result.count > 0 ? ' hot' : '');
      void age;
    }
  }
  requestAnimationFrame(drawLoop);
}

function serviceCard (s) {
  const ok = s.healthy;
  return `<div class="card ${ok ? '' : 'bad'}">
    <div class="top">
      <span class="dot ${ok ? 'ok' : 'bad'}"></span>
      <span class="name">${s.name}</span>
      ${s.version ? `<span class="ver">${s.version}</span>` : ''}
    </div>
    <div class="detail">${s.detail ?? (ok ? 'çalışıyor' : 'erişilemiyor')}</div>
    ${s.latency_ms != null ? `<div class="lat">${s.latency_ms} ms</div>` : ''}
  </div>`;
}

async function refreshCameras () {
  const data = await (await fetch('/api/v1/cameras')).json();
  const container = $('cameras');

  for (const cam of data.cameras) {
    let entry = cards.get(cam.name);
    if (!entry) {
      entry = createCard(cam, container);
      renderIdle(entry, cam);
    }
    // Webcam kartı kendi durumunu yönetir (aç/kapat düğmesi)
    if (cam.kind === 'webcam' && !entry.playing) renderWebcam(entry, cam);
    // Yalnızca durum göstergesini güncelle — oynayan iframe'e DOKUNMA
    entry.dot.className = 'dot ' + (cam.ready ? 'ok' : 'idle');
    entry.meta.title = cam.label + (cam.readers ? ` · ${cam.readers} izleyici` : '');
  }

  const playingCount = [...cards.values()].filter(e => e.playing).length;
  const pipelineStale = wsFrames === 0 || (performance.now() - lastFrameAt) > STALE_MS;
  const pipelineNote = pipelineStale
    ? `<br><b style="color:var(--warn)">⚠ Analiz sonucu gelmiyor.</b> ` +
      `Kutuların görünmesi için ingest ve inference worker'ları çalışmalı:<br>` +
      `<code>uv run python -m sentinel.ingest.worker --all --owner</code><br>` +
      `<code>uv run python -m sentinel.inference.worker --batch-size 8</code>`
    : `<br>Analiz akıyor: <b>${wsFrames}</b> sonuç alındı.`;
  $('camnote').innerHTML =
    `<b>${data.total}</b> kamera tanımlı · <b>${data.ready}</b> yayında · ` +
    `<b>${playingCount}</b> oynatıcı açık.<br>` +
    `Yayınlar <b>istek üzerine</b> başlar (runOnDemand) — 23 akışı sürekli ` +
    `açık tutmak boşuna CPU harcar. Kartlar bir kez oluşturulur; yenilemede ` +
    `yalnızca durum güncellenir, oynayan video kesilmez.` + pipelineNote;
}

async function refresh () {
  await loadConfig();

  let data;
  try {
    data = await (await fetch('/api/v1/system/health')).json();
  } catch {
    $('stamp').textContent = '● API erişilemiyor';
    return;
  }
  $('services').innerHTML = data.services.map(serviceCard).join('');

  try {
    await refreshCameras();
  } catch (e) {
    $('camnote').textContent = 'Kamera listesi alınamadı: ' + e;
  }

  $('stamp').textContent =
    (data.healthy ? '● tüm servisler sağlıklı' : '● bazı servisler sorunlu') +
    ` · WS ${wsState} (${wsFrames} kare)` +
    ' · ' + new Date().toLocaleTimeString('tr-TR');
}

refresh();
setInterval(refresh, 5000);

// KT1: WebSocket + canvas çizim döngüsü
connectWs();
requestAnimationFrame(drawLoop);
</script>
</body>
</html>
