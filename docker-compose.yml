# ══════════════════════════════════════════════════════════════
#  SENTINEL — Geliştirme Altyapısı
#
#  Kullanım:
#    docker compose up -d              # temel altyapı
#    docker compose --profile storage up -d   # + Garage (Hafta 4)
#    docker compose ps                 # durum
#    docker compose logs -f <servis>
#    docker compose down               # durdur  (-v = verileri de sil)
#
#  ⚠ GÜVENLİK: Tüm portlar 127.0.0.1'e bağlıdır — dış ağa AÇIK DEĞİL.
#    Python YZ worker'ları Windows'ta native çalıştığı için localhost
#    erişimi gereklidir. Üretimde bu portlar tamamen kapatılır
#    (PLAN.md §11.1 / G16).
# ══════════════════════════════════════════════════════════════

name: sentinel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ─── Ortak tanım: beş servis de bunu miras alıyor ───
#
# ⚠⚠ 06.09.2026 — `profiles` OLMADAN BU BLOK SİSTEMİ KİLİTLİYORDU
#
# Bu beş servis `build:` içeriyor. Profil verilmediğinde Compose onları
# VARSAYILAN servis sayıyor ve `docker compose up -d` komutu, yalnızca
# altyapıyı ayağa kaldırmak isteyen kullanıcıya haber vermeden
# **16.8 GB'lık imajı derlemeye başlıyordu.**
#
# Belirtisi teşhisi zorlaştırıyordu: komut "takılmış" gibi görünüyor,
# hiçbir konteyner ayağa kalkmıyor, hata da vermiyor — çünkü aslında
# çalışıyor, sadece PyTorch+CUDA indiriyor.
#
# ⚠ Ve bu derleme bir kez C: diskini TAMAMEN doldurdu: 67 GB ara ürün
# + 16.8 GB imaj. Docker'ın varsayılan veri konumu C:'de ve derlemeden
# önce boş alan kontrol edilmemişti.
#
# Artık iki ayrı komut var ve ikisi de ne yapacağını söylüyor:
#
#     docker compose up -d                  → SADECE altyapı (derleme YOK)
#     docker compose --profile app up -d    → + uygulama (imaj gerekli)
#
# ⭐ Ders: bir dosyaya eklenen servis, o dosyayı kullanan HERKESİN
# varsayılan davranışını değiştirir. `profiles` bu değişikliği
# "istersen" hâline getiriyor.
x-app: &app
  profiles: ["app"]
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: sentinel-app:latest
  restart: unless-stopped
  env_file: [.env]
  environment: &app-env
    # ⚠ Konteyner içinden servisler ADIYLA çözülüyor, 127.0.0.1 ile
    # değil: her konteynerin kendi loopback'i var ve `127.0.0.1`
    # konteynerin KENDİSİNİ işaret eder.
    VALKEY_HOST: valkey
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    MEDIAMTX_HOST: mediamtx
    MEDIAMTX_API_PORT: "9997"
    MEDIAMTX_RTSP_PORT: "8554"
    # ⚠ AMA WHEP ADRESİ TARAYICIYA GİDİYOR — o Docker ağının dışında
    # ve `mediamtx` adını çözemez (bkz. config.py · mediamtx_public_host).
    MEDIAMTX_PUBLIC_HOST: "127.0.0.1"
    VALKEY_URL: ""          # host/port'tan türetilsin
  volumes:
    - ./backend/models:/app/models:ro
    - ./data:/app/data
    - ./benchmarks:/app/benchmarks
  networks: [sentinel]
  logging: *default-logging

services:

  # ─── VALKEY — mesaj kuyruğu (Streams) + canlı durum önbelleği ───
  valkey:
    image: valkey/valkey:8-alpine
    container_name: sentinel-valkey
    restart: unless-stopped
    command: >
      valkey-server /etc/valkey/valkey.conf
      --requirepass ${VALKEY_PASSWORD:?VALKEY_PASSWORD gerekli}
    volumes:
      - ./infra/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    networks: [sentinel]
    logging: *default-logging

  # ─── POSTGRESQL + TIMESCALEDB — olaylar, metrikler, denetim ───
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      # Zaman dilimi — olay zaman damgaları için kritik
      TZ: ${TZ:-Europe/Istanbul}
      PGTZ: ${TZ:-Europe/Istanbul}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sentinel]
    logging: *default-logging

  # ─── MEDIAMTX — kamera çiftliği (RTSP) + tarayıcıya WebRTC/WHEP ───
  #  Yeniden kodlama YAPMAZ; sadece kapsayıcı değiştirir (PLAN.md §3.3)
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: sentinel-mediamtx
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data/videos:/videos:ro
      # ⚠ Bu bağlama YAZILABİLİR (:ro yok) — olay klibinin kaynağı.
      # MediaMTX akışları buraya kaydediyor; alarm anında ilgili zaman
      # aralığı yeniden kodlanmadan kesilip Garage'a yükleniyor.
      # Gerekçe: infra/mediamtx/mediamtx.yml · "SÜREKLİ KAYIT" bloğu.
      - ./data/recordings:/recordings
    environment:
      # ⚠ KAYIT ANAHTARI — varsayılan KAPALI
      # Kaynak videolar sonsuz döngüde yayınlanıyor, yani kayıt açıksa
      # disk durmadan yazılır (~14 GB/saat, ölçüldü). Klip/alarm zinciri
      # üzerinde çalışılmayan günlerde bu saf israf.
      # Açmak için `.env` içinde MEDIAMTX_RECORD=yes, sonra:
      #     docker compose up -d mediamtx
      MTX_PATHDEFAULTS_RECORD: ${MEDIAMTX_RECORD:-no}
    ports:
      - "127.0.0.1:${MEDIAMTX_RTSP_PORT:-8554}:8554"      # RTSP
      - "127.0.0.1:${MEDIAMTX_WEBRTC_PORT:-8889}:8889"    # WebRTC / WHEP
      - "127.0.0.1:8189:8189/udp"                          # WebRTC ICE
      - "127.0.0.1:${MEDIAMTX_API_PORT:-9997}:9997"       # yönetim API
      - "127.0.0.1:9998:9998"                              # Prometheus metrikleri
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9997/v3/paths/list > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [sentinel]
    logging: *default-logging

  # ─── PROMETHEUS — metrik toplama ───
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      # Windows'ta native çalışan Python worker'larına ulaşmak için
      - "host.docker.internal:host-gateway"
    networks: [sentinel]
    logging: *default-logging

  # ─── GRAFANA — paneller ───
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD gerekli}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks: [sentinel]
    logging: *default-logging

  # ─── GARAGE — S3 uyumlu klip arşivi ───
  #  ⚠ Tek seferlik "layout" kurulumu gerektirir → Hafta 4'e ertelendi.
  #    Klipler Gün 19'a kadar gerekmiyor; o zamana dek STORAGE_BACKEND=localfs.
  #    Başlatmak için:  docker compose --profile storage up -d
  #    Ardından:        pwsh infra/garage/init.ps1
  garage:
    image: dxflrs/garage:v2.0.0
    container_name: sentinel-garage
    restart: unless-stopped
    profiles: ["storage"]
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"   # S3 API
      - "127.0.0.1:3903:3903"   # yönetim API
    networks: [sentinel]
    logging: *default-logging

  # ══════════════════════════════════════════════════════════════
  #  UYGULAMA — API + YZ worker'ları  (03.09.2026'da eklendi)
  # ══════════════════════════════════════════════════════════════
  #
  # ⚠ NEDEN ŞİMDİYE KADAR YOKTU
  # Geliştirme stratejisi "altyapı Docker'da, Python worker'ları
  # Windows'ta native" idi ve gerekçesi şuydu: *"Windows+Docker+GPU =
  # WSL2 karmaşası, iterasyonu yavaşlatır"* (CLAUDE.md §2).
  #
  # ⚠ O GEREKÇE SINANDI VE ÇÜRÜDÜ (03.09.2026)
  #     docker run --rm --gpus all nvidia/cuda:12.8.0-base nvidia-smi
  #     → NVIDIA GeForce RTX 3070 Laptop GPU, 8192 MiB
  # `nvidia` çalışma zamanı Docker'a kayıtlıydı. Varsayım, bir kez
  # denenmeden on sekiz gün taşındı — ADR-0006'nın dersinin tekrarı:
  # *"bir kararın gerekçesi belgeye girdikten sonra veri gibi
  # davranmaya başlıyor."*
  #
  # ⚠ TEK İMAJ, BEŞ SERVİS: hepsi aynı `sentinel-app` imajını
  # kullanıyor, yalnızca `command` farklı. Beş ayrı imaj beş kez
  # ~6 GB'lık PyTorch+CUDA katmanı demekti.
  #
  # ⚠ BAŞLATMA SIRASI TEKNİK ZORUNLULUK (start_all.ps1 ile aynı):
  #   ingest → paylaşımlı bellek havuzunu O YARATIR (`--owner`)
  #   inference → havuza BAĞLANIR, önce havuz var olmalı
  # `depends_on` bunu garanti ediyor; elle sıra takibi gerekmiyor.

  # ─── API + React paneli ───
  api:
    <<: *app
    container_name: sentinel-api
    command: ["uvicorn", "sentinel.api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *app-env
      # Panel konteyner dışından açılıyor; köken doğrulaması host
      # adresini tanımalı (P-11 / P-21 — `localhost` ile `127.0.0.1`
      # AYRI kökenlerdir, ikisi de yazılıyor).
      ALLOWED_ORIGINS: "http://127.0.0.1:8001,http://localhost:8001,http://127.0.0.1:5173"
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    depends_on:
      valkey: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/api/v1/system/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── ALIM — paylaşımlı bellek havuzunun SAHİBİ ───
  ingest:
    <<: *app
    container_name: sentinel-ingest
    # ⚠ `ipc: shareable` — KONTEYNERLEŞTİRMENİN EN KRİTİK SATIRI
    #
    # Mimari kural 1: ham kare Valkey'den geçmez, paylaşımlı bellek
    # kullanılır (1080p kare ~6 MB). Ama paylaşımlı bellek segmentleri
    # IPC ad alanına özeldir: iki ayrı konteyner varsayılan olarak
    # BİRBİRİNİN `/dev/shm`'ini göremez.
    #
    # Bu satır olmadan çıkarım worker'ı havuzu bulamaz ve sistem
    # "kare gelmiyor" diye SESSİZCE durur — tam olarak P-38'in
    # belirtisi. `shareable`, bu ad alanını başka konteynerlere
    # açıyor; `inference` aşağıda ona katılıyor.
    ipc: shareable
    # Havuz 48 slot × ~1.2 MB; varsayılan 64 MB `/dev/shm` yetmez.
    shm_size: "512mb"
    command: ["python", "-m", "sentinel.ingest.worker", "--all", "--owner",
              "--metrics-port", "9101", "--stats-interval", "300"]
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      valkey: {condition: service_healthy}
      mediamtx: {condition: service_healthy}

  # ─── ÇIKARIM — GPU · modeller TEK KOPYA (mimari kural 3) ───
  inference:
    <<: *app
    container_name: sentinel-inference
    # Alım worker'ının IPC ad alanına KATILIYOR — paylaşımlı bellek
    # havuzunu ancak böyle görebiliyor.
    ipc: "service:ingest"
    command: ["python", "-m", "sentinel.inference.worker",
              "--batch-size", "8", "--stats-interval", "300"]
    ports:
      - "127.0.0.1:9110:9110"
    # ⚠ GPU AYIRMA — Compose'un `deploy.resources` biçimi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      ingest: {condition: service_started}

  # ─── ANALİTİK — anomali + saldırganlık + füzyon ───
  analytics:
    <<: *app
    container_name: sentinel-analytics
    command: ["python", "-m", "sentinel.analytics.worker", "--stats-interval", "300"]
    ports:
      - "127.0.0.1:9120:9120"
    depends_on:
      inference: {condition: service_started}

  # ─── ALARM — olayları TimescaleDB'ye kalıcılaştırır ───
  alerting:
    <<: *app
    container_name: sentinel-alerting
    command: ["python", "-m", "sentinel.alerting.worker"]
    ports:
      - "127.0.0.1:9130:9130"
    depends_on:
      postgres: {condition: service_healthy}
      analytics: {condition: service_started}

networks:
  sentinel:
    name: sentinel-net
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  garage-meta:
  garage-data:
